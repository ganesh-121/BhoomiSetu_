    // --- GIS MAP COMPONENT --- //
    function GisMapViewComponent({ parcels, onSelect, onVerify }) {
      const [selected, setSelected] = useState(parcels[0]);
      const [locationQuery, setLocationQuery] = useState('');
      const [mapTileStyle, setMapTileStyle] = useState('dark');
      const [layerState, setLayerState] = useState({
        baseCadastral: true,
        governanceStatus: true,
        utilitiesGrid: true
      });

      const mapRef = useRef(null);
      const leafletInstance = useRef(null);
      const polygonLayers = useRef([]);

      const filteredParcels = parcels.filter(p => 
        p.village.toLowerCase().includes(locationQuery.toLowerCase()) ||
        p.ulpin.toLowerCase().includes(locationQuery.toLowerCase()) ||
        p.surveyNo.toLowerCase().includes(locationQuery.toLowerCase()) ||
        p.owner.name.toLowerCase().includes(locationQuery.toLowerCase())
      );

      const handleLocationSearchSubmit = (e) => {
        e.preventDefault();
        if (filteredParcels.length > 0) {
          flyToParcel(filteredParcels[0]);
        }
      };

      useEffect(() => {
        if (!window.L || !mapRef.current) return;
        const L = window.L;

        if (leafletInstance.current) {
          leafletInstance.current.remove();
        }

        const map = L.map(mapRef.current, {
          center: [18.55, 73.80],
          zoom: 12,
          zoomControl: true
        });

        leafletInstance.current = map;

        let tileUrl = 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
        if (mapTileStyle === 'dark') {
          tileUrl = `https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png`;
        } else if (mapTileStyle === 'satellite') {
          tileUrl = `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}`;
        }

        L.tileLayer(tileUrl, {
          maxZoom: 19,
          attribution: '&copy; BhoomiSetu Spatial Infrastructure'
        }).addTo(map);

        polygonLayers.current = [];

        parcels.forEach(p => {
          let color = p.status === 'Verified' ? '#059669' : p.status === 'Issue Found' ? '#e11d48' : '#d97706';
          
          const poly = L.polygon(p.coordinates, {
            color: color,
            fillColor: color,
            fillOpacity: layerState.governanceStatus ? (selected.ulpin === p.ulpin ? 0.75 : 0.4) : 0.15,
            weight: selected.ulpin === p.ulpin ? 4 : 2,
            dashArray: layerState.utilitiesGrid ? '4, 4' : null
          }).addTo(map);

          poly.bindPopup(`
            <div style="padding: 4px;">
              <span style="font-size: 10px; font-weight: 700; color: #38bdf8; text-transform: uppercase;">ULPIN: ${p.ulpin}</span>
              <div style="font-size: 13px; font-weight: 700; color: #ffffff; margin-top: 2px;">Survey No: ${p.surveyNo} (${p.village})</div>
              <div style="font-size: 11px; color: #94a3b8; margin-top: 4px;">Owner: <b>${p.owner.name}</b></div>
              <div style="font-size: 11px; color: #94a3b8;">Area: <b>${p.areaSqM} m²</b> (${p.areaAcres} Acres)</div>
              <div style="margin-top: 6px; padding: 2px 6px; font-size: 10px; font-weight: 700; border-radius: 4px; display: inline-block; background-color: ${color}33; color: ${color}; border: 1px solid ${color}66;">
                Status: ${p.status}
              </div>
            </div>
          `);

          poly.on('click', () => setSelected(p));
          polygonLayers.current.push({ ulpin: p.ulpin, poly });
        });

        setTimeout(() => {
          if (map) map.invalidateSize();
        }, 250);

        return () => {
          if (leafletInstance.current) {
            leafletInstance.current.remove();
            leafletInstance.current = null;
          }
        };
      }, [parcels, mapTileStyle, layerState]);

      const flyToParcel = (p) => {
        setSelected(p);
        if (leafletInstance.current && window.L) {
          leafletInstance.current.setView(p.center, 16, { animate: true });
        }
      };

      return (
        <div className="space-y-4">
          <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-slate-900 p-4 rounded-2xl border border-slate-800 shadow-2xl">
            <div>
              <h2 className="text-xl font-bold text-white flex items-center space-x-2">
                <i className="fa-solid fa-map-location-dot text-cyan-400"></i>
                <span>Interactive Cadastral GIS Map</span>
              </h2>
              <p className="text-xs text-slate-400">Type location (Baner, Aundh, Wakad, Hinjawadi) to locate plot.</p>
            </div>

            <form onSubmit={handleLocationSearchSubmit} className="flex gap-2 w-full md:w-auto flex-1 max-w-md">
              <div className="relative flex-1">
                <input
                  type="text"
                  placeholder="Search exact location (e.g. Baner, Aundh, Wakad)..."
                  value={locationQuery}
                  onChange={(e) => setLocationQuery(e.target.value)}
                  className="w-full pl-9 pr-4 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-cyan-500"
                />
                <i className="fa-solid fa-magnifying-glass text-slate-400 absolute left-3 top-3 text-xs"></i>
              </div>
              <button
                type="submit"
                className="px-4 py-2.5 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded-xl text-xs shadow flex items-center space-x-1"
              >
                <span>Find Plot</span>
              </button>
            </form>

            <div className="flex items-center space-x-2 text-xs bg-slate-950 p-1 rounded-xl border border-slate-800">
              <button onClick={() => setMapTileStyle('dark')} className={`px-2.5 py-1 rounded-lg font-bold transition-all ${mapTileStyle === 'dark' ? 'bg-cyan-600 text-white' : 'text-slate-400 hover:text-white'}`}>Dark</button>
              <button onClick={() => setMapTileStyle('streets')} className={`px-2.5 py-1 rounded-lg font-bold transition-all ${mapTileStyle === 'streets' ? 'bg-cyan-600 text-white' : 'text-slate-400 hover:text-white'}`}>Streets</button>
              <button onClick={() => setMapTileStyle('satellite')} className={`px-2.5 py-1 rounded-lg font-bold transition-all ${mapTileStyle === 'satellite' ? 'bg-cyan-600 text-white' : 'text-slate-400 hover:text-white'}`}>Satellite</button>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 min-h-[580px]">
            <div className="lg:col-span-8 bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-2xl relative min-h-[520px]">
              <div className="absolute top-4 left-4 z-[400] bg-slate-900/90 p-3 rounded-xl border border-slate-700/80 shadow-2xl backdrop-blur-md text-xs space-y-2 max-w-xs">
                <div className="font-bold text-white pb-1 border-b border-slate-700 flex items-center space-x-1.5"><i className="fa-solid fa-layer-group text-cyan-400"></i><span>GIS Layer Controls</span></div>
                <label className="flex items-center space-x-2 text-slate-200 cursor-pointer"><input type="checkbox" checked={layerState.baseCadastral} onChange={(e) => setLayerState({ ...layerState, baseCadastral: e.target.checked })} className="rounded text-cyan-500 bg-slate-800" /><span>Cadastral Boundaries</span></label>
                <label className="flex items-center space-x-2 text-slate-200 cursor-pointer"><input type="checkbox" checked={layerState.governanceStatus} onChange={(e) => setLayerState({ ...layerState, governanceStatus: e.target.checked })} className="rounded text-cyan-500 bg-slate-800" /><span>Governance Status Colors</span></label>
                <label className="flex items-center space-x-2 text-slate-200 cursor-pointer"><input type="checkbox" checked={layerState.utilitiesGrid} onChange={(e) => setLayerState({ ...layerState, utilitiesGrid: e.target.checked })} className="rounded text-cyan-500 bg-slate-800" /><span>Utilities Grid</span></label>
              </div>

              <div ref={mapRef} className="gis-map-canvas"></div>
            </div>

            <div className="lg:col-span-4 bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-2xl overflow-y-auto space-y-4 text-xs">
              <div>
                <span className="text-[10px] text-slate-400 font-bold uppercase tracking-wider block mb-1.5">Locate Land Plot:</span>
                <div className="flex flex-wrap gap-1.5">
                  {filteredParcels.map(p => (
                    <button key={p.ulpin} onClick={() => flyToParcel(p)} className={`px-2.5 py-1.5 rounded-lg font-mono font-bold text-[11px] transition-all flex items-center space-x-1 ${selected.ulpin === p.ulpin ? 'bg-cyan-500 text-white shadow' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}>
                      <span>{p.village}</span><span className="text-[9px] opacity-75">({p.surveyNo})</span>
                    </button>
                  ))}
                </div>
              </div>

              <div className="pt-3 border-t border-slate-800 space-y-3">
                <div className="flex justify-between items-start">
                  <div>
                    <span className="font-mono text-cyan-400 font-bold uppercase text-[10px] bg-cyan-500/10 px-2 py-0.5 rounded">ULPIN {selected.ulpin}</span>
                    <h3 className="text-lg font-bold text-white mt-1">Survey No. {selected.surveyNo}</h3>
                    <p className="text-slate-400">Village {selected.village}, {selected.district}</p>
                  </div>
                  <span className={`px-2.5 py-1 rounded-full font-bold text-[10px] ${selected.status === 'Verified' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'}`}>{selected.status}</span>
                </div>

                <div className="grid grid-cols-2 gap-2 text-[11px]">
                  <div className="bg-slate-800 p-2.5 rounded-xl"><span className="text-slate-400">Plot Area:</span><strong className="block text-white text-xs">{selected.areaSqM} m² ({selected.areaAcres} Acres)</strong></div>
                  <div className="bg-slate-800 p-2.5 rounded-xl"><span className="text-slate-400">Zoning Zone:</span><strong className="block text-cyan-300 text-xs truncate">{selected.landUse.zone}</strong></div>
                </div>

                <div className="bg-slate-800/40 p-3 rounded-xl space-y-1 border border-slate-800">
                  <span className="font-bold text-slate-200">Owner (7/12):</span>
                  <p className="text-sm font-bold text-white">{selected.owner.name}</p>
                </div>

                <div className="space-y-2 pt-1">
                  <button onClick={() => onSelect(selected.ulpin)} className="w-full py-2.5 bg-cyan-600 text-white font-bold rounded-xl text-xs shadow-lg"><i className="fa-solid fa-eye mr-1"></i>View 8-Domain Plot Details</button>
                  <button onClick={() => onVerify(selected.ulpin)} className="w-full py-2.5 bg-emerald-600/20 text-emerald-300 border border-emerald-500/30 font-bold rounded-xl text-xs"><i className="fa-solid fa-shield-halved mr-1"></i>Run Verification Audit</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }
